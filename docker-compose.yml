services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "9000:9000" # native protocol (used by ES)
      - "8123:8123" # HTTP
    environment:
      CLICKHOUSE_PASSWORD: clickhouse
      # Created on first start; the schema is applied with `make migrate-up` (cmd/migrate).
      CLICKHOUSE_DB: es_db
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "clickhouse", "-q", "SELECT 1"]
      interval: 5s
      retries: 20
